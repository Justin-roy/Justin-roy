name: art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "profile.json"
      - "scripts/render_portrait.py"
      - "scripts/render_card.py"
      - "scripts/common.py"

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rembg[cpu]" opencv-python-headless pillow pillow-heif
      - name: Render portrait, card and README
        run: |
          python scripts/render_portrait.py
          python scripts/render_card.py
          python scripts/build_readme.py
          python scripts/verify.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii-portrait.svg info-card.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate profile art [skip ci]"
          git pull --rebase
          git push
